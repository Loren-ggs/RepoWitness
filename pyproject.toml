[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repowitness"
version = "0.2.0"
description = "Evidence-backed review against your repository's own rules."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
keywords = ["ai", "agent", "code-review", "repository", "contracts", "git"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["repowitness"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
dev = ["pytest>=7.0", "ruff==0.16.0"]

[project.scripts]
repowitness = "repowitness.cli:main"

[project.urls]
Homepage = "https://github.com/Loren-ggs/RepoWitness"
Repository = "https://github.com/Loren-ggs/RepoWitness"
Issues = "https://github.com/Loren-ggs/RepoWitness/issues"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
