name: RepoWitness
description: Evidence-backed review against your repository's own rules.
branding:
  icon: shield
  color: blue
inputs:
  base:
    description: Optional base Git ref. Defaults to the PR base SHA or repository default branch.
    required: false
    default: ""
  api-key:
    description: Model API key. Defaults to the REPOWITNESS_API_KEY environment variable.
    required: false
    default: ""
  contracts-ref:
    description: "Contract revision: base, head, or worktree."
    required: false
    default: base
  output:
    description: Markdown report path inside the checked-out repository.
    required: false
    default: repowitness-report.md
  python-version:
    description: Python version used to run RepoWitness.
    required: false
    default: "3.13"
  check-results:
    description: Newline-separated check-result JSON paths to import.
    required: false
    default: ""
  junit:
    description: Newline-separated JUnit XML paths to import.
    required: false
    default: ""
  sarif:
    description: Newline-separated SARIF JSON paths to import.
    required: false
    default: ""
  evidence-snapshot:
    description: Snapshot captured before generating JUnit or SARIF files.
    required: false
    default: ""
  fail-on:
    description: Newline-separated verdicts that should fail the action.
    required: false
    default: ""
  comment:
    description: Create or update the RepoWitness pull request comment.
    required: false
    default: "true"
  github-token:
    description: GitHub token used only when comment is true. Defaults to github.token.
    required: false
    default: ""
outputs:
  report:
    description: Absolute path to the generated Markdown report.
    value: ${{ steps.audit.outputs.report }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version || '3.13' }}
        cache: pip

    - name: Install RepoWitness
      shell: bash
      run: python -m pip install "${{ github.action_path }}"

    - name: Run RepoWitness
      id: audit
      shell: bash
      env:
        REPOWITNESS_ACTION_BASE: ${{ inputs.base }}
        REPOWITNESS_ACTION_API_KEY: ${{ inputs.api-key }}
        REPOWITNESS_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        REPOWITNESS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REPOWITNESS_ACTION_CONTRACTS_REF: ${{ inputs.contracts-ref }}
        REPOWITNESS_ACTION_OUTPUT: ${{ inputs.output }}
        REPOWITNESS_ACTION_CHECK_RESULTS: ${{ inputs.check-results }}
        REPOWITNESS_ACTION_JUNIT: ${{ inputs.junit }}
        REPOWITNESS_ACTION_SARIF: ${{ inputs.sarif }}
        REPOWITNESS_ACTION_EVIDENCE_SNAPSHOT: ${{ inputs.evidence-snapshot }}
        REPOWITNESS_ACTION_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        base_ref="${REPOWITNESS_ACTION_BASE:-${REPOWITNESS_EVENT_BASE_SHA:-${REPOWITNESS_DEFAULT_BRANCH}}}"
        contracts_ref="${REPOWITNESS_ACTION_CONTRACTS_REF:-base}"
        report_output="${REPOWITNESS_ACTION_OUTPUT:-repowitness-report.md}"
        if [[ -z "${base_ref}" ]]; then
          echo "RepoWitness 无法确定基准版本；请显式传入 base。" >&2
          exit 1
        fi
        if [[ -n "${REPOWITNESS_ACTION_API_KEY}" ]]; then
          export REPOWITNESS_API_KEY="${REPOWITNESS_ACTION_API_KEY}"
        fi
        report_path="${GITHUB_WORKSPACE}/${report_output}"
        check_result_args=()
        while IFS= read -r check_result_path; do
          if [[ -n "${check_result_path}" ]]; then
            check_result_args+=(--check-results "${check_result_path}")
          fi
        done <<< "${REPOWITNESS_ACTION_CHECK_RESULTS}"
        native_result_args=()
        while IFS= read -r junit_path; do
          if [[ -n "${junit_path}" ]]; then
            native_result_args+=(--junit "${junit_path}")
          fi
        done <<< "${REPOWITNESS_ACTION_JUNIT}"
        while IFS= read -r sarif_path; do
          if [[ -n "${sarif_path}" ]]; then
            native_result_args+=(--sarif "${sarif_path}")
          fi
        done <<< "${REPOWITNESS_ACTION_SARIF}"
        if [[ -n "${REPOWITNESS_ACTION_EVIDENCE_SNAPSHOT}" ]]; then
          native_result_args+=(
            --evidence-snapshot "${REPOWITNESS_ACTION_EVIDENCE_SNAPSHOT}"
          )
        fi
        fail_on_args=()
        while IFS= read -r verdict; do
          if [[ -n "${verdict}" ]]; then
            fail_on_args+=(--fail-on "${verdict}")
          fi
        done <<< "${REPOWITNESS_ACTION_FAIL_ON}"
        set +e
        repowitness audit \
          --repository "${GITHUB_WORKSPACE}" \
          --base "${base_ref}" \
          --contracts-ref "${contracts_ref}" \
          "${check_result_args[@]}" \
          "${native_result_args[@]}" \
          "${fail_on_args[@]}" \
          --format markdown \
          --output "${report_path}"
        audit_status=$?
        set -e
        if [[ -f "${report_path}" ]]; then
          cat "${report_path}" >> "${GITHUB_STEP_SUMMARY}"
          echo "report=${report_path}" >> "${GITHUB_OUTPUT}"
        fi
        echo "exit-code=${audit_status}" >> "${GITHUB_OUTPUT}"

    - name: Create or update pull request comment
      if: ${{ always() && inputs.comment != 'false' && github.event_name == 'pull_request' && steps.audit.outputs.report != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        REPOWITNESS_REPORT: ${{ steps.audit.outputs.report }}
        REPOWITNESS_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        comment_body="${RUNNER_TEMP}/repowitness-comment.md"
        python - "${REPOWITNESS_REPORT}" "${comment_body}" <<'PY'
        import sys
        from pathlib import Path

        report = Path(sys.argv[1]).read_text(encoding="utf-8")
        body = "<!-- repowitness-report -->\n\n" + report
        encoded = body.encode("utf-8")
        if len(encoded) > 65_000:
            body = (
                encoded[:62_000].decode("utf-8", errors="ignore")
                + "\n\n_评论内容已截断，请下载完整报告产物。_\n"
            )
        Path(sys.argv[2]).write_text(body, encoding="utf-8")
        PY
        comment_id="$(
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${REPOWITNESS_PR_NUMBER}/comments?per_page=100" |
            jq -r 'map(.[]) | map(select(.body | startswith("<!-- repowitness-report -->"))) | first | .id // empty'
        )"
        if [[ -n "${comment_id}" ]]; then
          jq -Rs '{body: .}' < "${comment_body}" |
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              --input - >/dev/null
        else
          jq -Rs '{body: .}' < "${comment_body}" |
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${REPOWITNESS_PR_NUMBER}/comments" \
              --input - >/dev/null
        fi

    - name: Enforce configured verdicts
      if: ${{ always() && steps.audit.outputs.exit-code != '0' }}
      shell: bash
      env:
        REPOWITNESS_EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
      run: exit "${REPOWITNESS_EXIT_CODE:-1}"
